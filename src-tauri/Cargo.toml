[package]
name = "oneshell-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "oneshell_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.86"
base64 = "0.22.1"
rand = "0.8.5"
russh = "0.60.2"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10.8"
tauri = { version = "2.0.0", features = [] }
thiserror = "1.0.63"
tokio = { version = "1.39.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-socks = "0.5.2"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
zeroize = "1.8.1"
